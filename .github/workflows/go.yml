name: Quality Gate

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Sync Dependencies & Prepare Testdata
        run: |
          go get golang.org/x/tools@v0.30.0
          go get golang.org/x/mod@v0.25.0
          go mod tidy
          go work vendor 
          
          mkdir -p internal/testdata/src/go.uber.org
          cp -aL vendor/go.uber.org/. internal/testdata/src/go.uber.org/
          find internal/testdata/src -name "go.mod" -delete

      - name: Run Tests with Coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check Coverage Threshold
        run: |
          total_cov=$(go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
          echo "Total coverage: $total_cov%"
          if [ $(echo "$total_cov < 50.0" | bc -l) -eq 1 ]; then
            echo "Error: Coverage is too low ($total_cov%). Expected at least 50%."
            exit 1
          fi

      - name: Build Linter and Plugin
        run: |
          go mod download -mod=readonly github.com/golangci/golangci-lint@v1.64.5
          CGO_ENABLED=1 go build -mod=vendor -buildmode=plugin -o loglint.so ./plugin/main.go
          CGO_ENABLED=1 go build -mod=vendor -o ./golangci-lint-bin github.com/golangci/golangci-lint/cmd/golangci-lint

      - name: Run golangci-lint
        run: |
          CGO_ENABLED=1 ./golangci-lint-bin run --config=.golangci.yml ./internal/exampleProject/...
        continue-on-error: true