name: Quality Gate

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Tidy dependencies
        run: go mod tidy

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Custom Log Linter
        run: go run ./cmd/linter/main.go ./...
        continue-on-error: true

      - name: Run Tests with Coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check Coverage Threshold
        run: |
          total_cov=$(go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
          echo "Total coverage: $total_cov%"
          is_enough=$(echo "$total_cov >= 50.0" | bc -l)
          
          if [ "$is_enough" -ne 1 ]; then
            echo "Error: Coverage is too low ($total_cov%). Expected at least 50%."
            exit 1
          fi
